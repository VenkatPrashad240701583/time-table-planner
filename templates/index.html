<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Timetable System - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            padding: 40px;
            width: 400px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        input, select {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            margin-top: 10px;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            cursor: pointer;
            color: white;
            background: var(--primary);
            font-weight: bold;
            font-size: 16px;
        }
        .neu-button {
            border-radius: var(--border-radius-sm);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: var(--transition);
        }
        .neu-button:active {
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        .neu-input {
            border-radius: var(--border-radius-sm);
            background: var(--surface);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            color: var(--text-dark);
        }
        .toggle-text {
            margin-top: 20px;
            color: var(--primary);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neu login-box">
            <h2 id="form-title">🔐 Login</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" class="neu-input" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>🔑 Password</label>
                    <input type="password" id="password" class="neu-input" required placeholder="••••••••">
                </div>
                <div class="input-group signup-only" style="display:none;">
                    <label>👤 Select Role</label>
                    <select id="role" class="neu-input">
                        <option value="STUDENT">Student</option>
                        <option value="TEACHER">Teacher</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <button type="submit" class="neu-button" id="submit-btn">Login</button>
            </form>
            <div class="toggle-text" id="toggle-form">✨ Don't have an account? Sign up</div>
        </div>
    </div>

    <script>
        let isLogin = true;
        
        document.getElementById('toggle-form').addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? '🔐 Login' : '🚀 Sign Up';
            document.getElementById('submit-btn').innerText = isLogin ? 'Login' : 'Sign Up';
            document.getElementById('toggle-form').innerText = isLogin ? "✨ Don't have an account? Sign up" : "🔙 Already have an account? Login";
            document.querySelector('.signup-only').style.display = isLogin ? 'none' : 'block';
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isLogin) {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const res = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    
                    // Decode JWT to get role (simple base64 decode for payload)
                    const payload = JSON.parse(atob(data.access_token.split('.')[1]));
                    if (payload.role === 'ADMIN') window.location.href = '/admin-dashboard';
                    else if (payload.role === 'TEACHER') window.location.href = '/teacher-dashboard';
                    else window.location.href = '/student-dashboard';
                } else {
                    alert('Login failed');
                }
            } else {
                const role = document.getElementById('role').value;
                const res = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });
                
                if (res.ok) {
                    alert('Signup successful! Please login.');
                    document.getElementById('toggle-form').click();
                } else {
                    alert('Signup failed');
                }
            }
        });
    </script>
</body>
</html>
