trigger:
- master

pool:
  name: Default

jobs:
- job: Deploy
  timeoutInMinutes: 0

  steps:
  - script: |
      whoami
      pwd
      python3 --version

      APP_DIR="$HOME/time-table-planner"

      mkdir -p $APP_DIR

      rsync -av --delete $(Build.SourcesDirectory)/ $APP_DIR/

      cd $APP_DIR

      ls -la

      python3 -m venv venv

      ./venv/bin/pip install --upgrade pip
      ./venv/bin/pip install -r requirements.txt

      ./venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    displayName: 'Debug Deployment'